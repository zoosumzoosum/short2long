# 색인 대상 채널과 영상 선정 규칙 (DECISIONS.md ⑤⑥⑦)
# 목표: 약 150편. 제목은 일본어 원제로 받아서 거른다 (yt-dlp 기본값은 번역된 제목을 줄 수 있음)

official:
  - name: CUTIE STREET
    url: https://www.youtube.com/@CUTIE_STREET
    limit: 60
  - name: MORE STAR
    url: https://www.youtube.com/@MORE_STAR1212
    limit: 30
  - name: KAWAII LAB.
    url: https://www.youtube.com/@KAWAII_LAB_OFFICIAL
    limit: 10
    # 소속 전 그룹이 섞여 있음 → 제목에 두 그룹이 들어간 것만
    require_title: ["CUTIE STREET", "きゅーすと", "MORE STAR", "もあすた"]

# 공식 채널: 아래 키워드가 제목에 있으면 제외 (무대·홍보 영상은 장면 묘사로 찾을 일이 적음) → 남은 것을 최신순으로 limit까지
exclude_title:
  - MV
  - Music Video
  - Teaser
  - ティザー
  - LIVE映像
  - ライブ映像
  - LIVE Footage
  - LIVE Performance
  - Lyric
  - Dance Practice
  - 振付
  - 予告

