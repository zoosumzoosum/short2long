services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # 컨테이너(root)가 마운트된 ./app에 __pycache__를 만들면 내 계정으로 못 지움
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # 수집 worker: api와 같은 이미지, 실행 명령만 다름. 찾아오는 손님이 없으니 ports 없음
  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONDONTWRITEBYTECODE: "1"
      # print가 버퍼에 쌓이지 않고 바로 docker logs에 보이게
      PYTHONUNBUFFERED: "1"
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      HOME: /tmp  # 내 계정(1000)으로 돌면 컨테이너 안에 홈이 없음 → yt-dlp·deno 캐시를 /tmp에
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./channels.yaml:/code/channels.yaml:ro
      - ./data:/code/data
    # data/에 생기는 파일을 root가 아닌 내 계정 소유로 (WSL id -u = 1000)
    user: "1000:1000"
    command: ["python", "-m", "app.worker"]

volumes:
  pgdata:
